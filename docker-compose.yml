services:
  postgres:
    image: postgres:16-alpine
    container_name: worldcraft-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: worldcraft
      POSTGRES_PASSWORD: worldcraft
      POSTGRES_DB: worldcraft
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worldcraft"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
